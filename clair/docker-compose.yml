services:
  clair:
    image: quay.io/projectquay/clair:4.9.0
    ports:
      - "6063:6063"
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      CLAIR_MODE: combo
      CLAIR_CONF: /etc/clair/config.yml
    volumes:
      - ./config.yml:/etc/clair/config.yml:ro

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: clair
      POSTGRES_PASSWORD: clairpass
      POSTGRES_DB: clair6000
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clair -d clair6000"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres-data: